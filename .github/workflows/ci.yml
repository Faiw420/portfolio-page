name: CI

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install modules
        run: bun install
      - name: Build
        run: bun run build
